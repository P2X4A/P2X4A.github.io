<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Portada del taller 1 de SQL sobre el esquema HR de Oracle: una consulta de ejemplo y las etiquetas LIKE, SUBSTR, IS NULL, TO_CHAR">
  <title>Taller SQL HR 1 — Filtros, texto y NULL</title>
  <rect width="480" height="270" fill="#0d0d26" />
  <rect x="8" y="8" width="464" height="254" fill="none" stroke="#3d3d7a" stroke-width="4" />
  <rect x="16" y="16" width="448" height="238" fill="none" stroke="#1c1c4a" stroke-width="2" />

  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <text x="32" y="44" fill="#63de86" font-size="14">TALLER SQL · HR</text>
    <text x="448" y="44" fill="#f4677a" font-size="14" text-anchor="end">#01</text>

    <rect x="32" y="56" width="416" height="118" fill="#171740" stroke="#62b4f8" stroke-width="3" />
    <rect x="32" y="56" width="416" height="18" fill="#62b4f8" />
    <text x="42" y="69" fill="#0d0d26" font-size="9">consulta.sql</text>
    <text x="44" y="96" font-size="12" xml:space="preserve"><tspan fill="#f4677a">SELECT</tspan><tspan fill="#e8e8ff"> first_name, last_name</tspan></text>
    <text x="44" y="115" font-size="12" xml:space="preserve"><tspan fill="#f4677a">FROM</tspan><tspan fill="#e8e8ff">   hr.employees</tspan></text>
    <text x="44" y="134" font-size="12" xml:space="preserve"><tspan fill="#f4677a">WHERE</tspan><tspan fill="#e8e8ff">  commission_pct </tspan><tspan fill="#f4677a">IS NOT NULL</tspan></text>
    <text x="44" y="153" font-size="12" xml:space="preserve"><tspan fill="#e8e8ff">  </tspan><tspan fill="#f4677a">AND</tspan><tspan fill="#e8e8ff">  SUBSTR(first_name, 3, 1) = 'a';</tspan></text>

    <rect x="32" y="188" width="56" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="60" y="205" fill="#63de86" font-size="10" text-anchor="middle">LIKE</text>
    <rect x="100" y="188" width="72" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="136" y="205" fill="#63de86" font-size="10" text-anchor="middle">SUBSTR</text>
    <rect x="184" y="188" width="80" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="224" y="205" fill="#63de86" font-size="10" text-anchor="middle">IS NULL</text>
    <rect x="276" y="188" width="80" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="316" y="205" fill="#63de86" font-size="10" text-anchor="middle">TO_CHAR</text>

    <text x="32" y="248" fill="#b8b8d8" font-size="8" font-weight="normal">FILTROS, TEXTO Y NULL</text>
  </g>
</svg>
