<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Portada de la ficha de los modelos de SIGEVET: la especialización de EMPLEADO en VETERINARIO y AUXILIAR y las etiquetas Chen, EER, Barker y Crow's Foot">
