<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Portada de la ficha de la aplicación web de SIGEVET: un método de un controlador REST en Spring Boot y las etiquetas Spring Boot, Angular, JDBC y REST">
