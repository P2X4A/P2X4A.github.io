    <rect x="32" y="56" width="416" height="18" fill="#62b4f8" />
    <text x="42" y="69" fill="#0d0d26" font-size="9">ClienteApiController.java</text>
    <text x="44" y="94" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">@GetMapping("/{id}")</tspan></text>
    <text x="44" y="109" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">public ClienteDetalleDTO detalle(</tspan></text>
    <text x="44" y="124" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">    @PathVariable int id) {</tspan></text>
    <text x="44" y="139" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">  return clienteService.detalle(id);</tspan></text>
    <text x="44" y="154" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">}</tspan></text>

    <rect x="32" y="187" width="112" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="88" y="204" fill="#63de86" font-size="10" text-anchor="middle">SPRING BOOT</text>
    <rect x="156" y="187" width="80" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="196" y="204" fill="#63de86" font-size="10" text-anchor="middle">ANGULAR</text>
    <rect x="248" y="187" width="56" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="276" y="204" fill="#63de86" font-size="10" text-anchor="middle">JDBC</text>
    <rect x="316" y="187" width="56" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="344" y="204" fill="#63de86" font-size="10" text-anchor="middle">REST</text>

