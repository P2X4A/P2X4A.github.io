<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Portada de la ficha de los 55 ejercicios de álgebra relacional de SIGEVET: la división del ejercicio 41 con doble NOT EXISTS">
  <title>SIGEVET · Algebra Relacional En Sql</title>
  <rect width="480" height="270" fill="#0d0d26" />
  <rect x="8" y="8" width="464" height="254" fill="none" stroke="#3d3d7a" stroke-width="4" />
  <rect x="16" y="16" width="448" height="238" fill="none" stroke="#1c1c4a" stroke-width="2" />

  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <text x="32" y="44" fill="#63de86" font-size="14">PROYECTO FINAL · SIGEVET</text>
    <text x="448" y="44" fill="#f4677a" font-size="14" text-anchor="end">#04</text>

    <rect x="32" y="56" width="416" height="117" fill="#171740" stroke="#62b4f8" stroke-width="3" />
    <rect x="32" y="56" width="416" height="18" fill="#62b4f8" />
    <text x="42" y="69" fill="#0d0d26" font-size="9">ejercicio41.sql</text>
    <text x="44" y="94" font-size="10" xml:space="preserve"><tspan fill="#f4677a">SELECT</tspan><tspan fill="#e8e8ff"> m.nombre </tspan><tspan fill="#f4677a">FROM</tspan><tspan fill="#e8e8ff"> MEDICAMENTO m</tspan></text>
    <text x="44" y="109" font-size="10" xml:space="preserve"><tspan fill="#f4677a">WHERE</tspan><tspan fill="#e8e8ff"> </tspan><tspan fill="#f4677a">NOT</tspan><tspan fill="#e8e8ff"> </tspan><tspan fill="#f4677a">EXISTS</tspan><tspan fill="#e8e8ff"> (</tspan><tspan fill="#f4677a">SELECT</tspan><tspan fill="#e8e8ff"> s.id_sede </tspan><tspan fill="#f4677a">FROM</tspan><tspan fill="#e8e8ff"> SEDE s</tspan></text>
    <text x="44" y="124" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">  </tspan><tspan fill="#f4677a">WHERE</tspan><tspan fill="#e8e8ff"> </tspan><tspan fill="#f4677a">NOT</tspan><tspan fill="#e8e8ff"> </tspan><tspan fill="#f4677a">EXISTS</tspan><tspan fill="#e8e8ff"> (</tspan><tspan fill="#f4677a">SELECT</tspan><tspan fill="#e8e8ff"> 1 </tspan><tspan fill="#f4677a">FROM</tspan><tspan fill="#e8e8ff"> INVENTARIO i</tspan></text>
    <text x="44" y="139" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">    </tspan><tspan fill="#f4677a">WHERE</tspan><tspan fill="#e8e8ff"> i.id_sede = s.id_sede</tspan></text>
    <text x="44" y="154" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">      </tspan><tspan fill="#f4677a">AND</tspan><tspan fill="#e8e8ff"> i.id_medicamento = m.id_medicamento));</tspan></text>

    <rect x="32" y="187" width="88" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="76" y="204" fill="#63de86" font-size="10" text-anchor="middle">DIVISION</text>
    <rect x="132" y="187" width="56" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="160" y="204" fill="#63de86" font-size="10" text-anchor="middle">JOIN</text>
    <rect x="200" y="187" width="64" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="232" y="204" fill="#63de86" font-size="10" text-anchor="middle">UNION</text>
    <rect x="276" y="187" width="120" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="336" y="204" fill="#63de86" font-size="10" text-anchor="middle">55 CONSULTAS</text>

    <text x="32" y="248" fill="#b8b8d8" font-size="8" font-weight="normal">ALGEBRA RELACIONAL EN SQL</text>
