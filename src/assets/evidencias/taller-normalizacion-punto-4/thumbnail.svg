<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Esquema relacional en 3FN: PACIENTE, VISITA, PROVEEDOR y ATENCION">
  <title>Esquema relacional en 3FN — visitas médicas</title>
  <rect width="480" height="270" fill="#0d0d26" />
  <rect x="8" y="8" width="464" height="254" fill="none" stroke="#3d3d7a" stroke-width="4" />
  <rect x="16" y="16" width="448" height="238" fill="none" stroke="#1c1c4a" stroke-width="2" />

  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <!-- PACIENTE -->
    <rect x="24" y="26" width="150" height="58" fill="#171740" stroke="#63de86" stroke-width="3" />
    <text x="34" y="44" fill="#63de86" font-size="11">PACIENTE</text>
    <text x="34" y="60" fill="#b8b8d8" font-size="10" font-weight="normal">PacNo PK</text>
    <text x="34" y="75" fill="#b8b8d8" font-size="9" font-weight="normal">PacEdad, PacCiudad</text>

    <!-- VISITA -->
    <rect x="306" y="26" width="150" height="58" fill="#171740" stroke="#62b4f8" stroke-width="3" />
    <text x="316" y="44" fill="#62b4f8" font-size="11">VISITA</text>
    <text x="316" y="60" fill="#b8b8d8" font-size="10" font-weight="normal">VisitaNo PK</text>
    <text x="316" y="75" fill="#b8b8d8" font-size="9" font-weight="normal">DiaVisita, PacNo</text>

    <!-- PROVEEDOR -->
    <rect x="24" y="196" width="150" height="58" fill="#171740" stroke="#f4677a" stroke-width="3" />
    <text x="34" y="214" fill="#f4677a" font-size="11">PROVEEDOR</text>
    <text x="34" y="230" fill="#b8b8d8" font-size="10" font-weight="normal">ProvNo PK</text>
    <text x="34" y="245" fill="#b8b8d8" font-size="9" font-weight="normal">ProvEspecialidad</text>

    <!-- ATENCION -->
    <rect x="306" y="196" width="150" height="58" fill="#171740" stroke="#f4677a" stroke-width="3" />
    <text x="316" y="214" fill="#f4677a" font-size="11">ATENCION</text>
    <text x="316" y="230" fill="#b8b8d8" font-size="9" font-weight="normal">(VisitaNo, ProvNo) PK</text>
    <text x="316" y="245" fill="#b8b8d8" font-size="10" font-weight="normal">Diagnostico</text>

    <!-- relations -->
    <g stroke="#8a8ab8" stroke-width="2" fill="none">
      <path d="M174 55 H306" />
      <path d="M381 84 V196" />
      <path d="M174 225 H306" />
    </g>
    <g fill="#8a8ab8">
      <rect x="236" y="51" width="8" height="8" />
      <rect x="377" y="136" width="8" height="8" />
      <rect x="236" y="221" width="8" height="8" />
    </g>
    <g font-size="9" fill="#7df9ff" font-weight="normal">
      <text x="182" y="47">PacNo FK</text>
      <text x="373" y="142" text-anchor="end">VisitaNo FK</text>
      <text x="196" y="221">ProvNo FK</text>
    </g>

    <text x="24" y="150" fill="#63de86" font-size="10">3FN — VISITAS MEDICAS</text>
    <text x="24" y="166" fill="#b8b8d8" font-size="9" font-weight="normal">tambien cumple BCNF</text>
  </g>
</svg>
