<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Esquema relacional en 3FN: MEMBER, VENUE, FOOD, DINNER, ATTENDANCE y MENU">
  <title>Esquema relacional en 3FN — club de cena</title>
  <rect width="480" height="270" fill="#0d0d26" />
  <rect x="8" y="8" width="464" height="254" fill="none" stroke="#3d3d7a" stroke-width="4" />
  <rect x="16" y="16" width="448" height="238" fill="none" stroke="#1c1c4a" stroke-width="2" />

  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <!-- fila 1 -->
    <rect x="16" y="26" width="140" height="40" fill="#171740" stroke="#63de86" stroke-width="3" />
    <text x="26" y="44" fill="#63de86" font-size="10">MEMBER</text>
    <text x="26" y="59" fill="#b8b8d8" font-size="9" font-weight="normal">MemberNum PK</text>

    <rect x="170" y="26" width="140" height="40" fill="#171740" stroke="#62b4f8" stroke-width="3" />
    <text x="180" y="44" fill="#62b4f8" font-size="10">DINNER</text>
    <text x="180" y="59" fill="#b8b8d8" font-size="9" font-weight="normal">DinnerNum PK</text>

    <rect x="324" y="26" width="140" height="40" fill="#171740" stroke="#f4677a" stroke-width="3" />
    <text x="334" y="44" fill="#f4677a" font-size="10">VENUE</text>
    <text x="334" y="59" fill="#b8b8d8" font-size="9" font-weight="normal">VenueCode PK</text>

    <!-- fila 2 -->
    <rect x="16" y="176" width="140" height="40" fill="#171740" stroke="#f4677a" stroke-width="3" />
    <text x="26" y="194" fill="#f4677a" font-size="10">ATTENDANCE</text>
    <text x="26" y="209" fill="#b8b8d8" font-size="8" font-weight="normal">(Member, Dinner) PK</text>

    <rect x="170" y="176" width="140" height="40" fill="#171740" stroke="#f4677a" stroke-width="3" />
    <text x="180" y="194" fill="#f4677a" font-size="10">MENU</text>
    <text x="180" y="209" fill="#b8b8d8" font-size="8" font-weight="normal">(Dinner, Food) PK</text>

    <rect x="324" y="176" width="140" height="40" fill="#171740" stroke="#63de86" stroke-width="3" />
    <text x="334" y="194" fill="#63de86" font-size="10">FOOD</text>
    <text x="334" y="209" fill="#b8b8d8" font-size="9" font-weight="normal">FoodCode PK</text>

    <!-- relaciones -->
    <g stroke="#8a8ab8" stroke-width="2" fill="none">
      <path d="M86 66 V176" />
      <path d="M240 66 V120 H86" />
      <path d="M240 120 V176" />
      <path d="M324 46 H310" />
      <path d="M324 196 H310" />
    </g>
    <g fill="#8a8ab8">
      <rect x="82" y="112" width="8" height="8" />
      <rect x="236" y="116" width="8" height="8" />
      <rect x="313" y="42" width="8" height="8" />
      <rect x="313" y="192" width="8" height="8" />
    </g>
    <g font-size="8" fill="#7df9ff" font-weight="normal">
      <text x="94" y="100">MemberNum</text>
      <text x="246" y="100">DinnerNum</text>
    </g>

    <text x="16" y="244" fill="#63de86" font-size="10">3FN — 6 TABLAS</text>
    <text x="150" y="244" fill="#b8b8d8" font-size="8" font-weight="normal">asistencia y menu, por separado</text>
  </g>
</svg>
