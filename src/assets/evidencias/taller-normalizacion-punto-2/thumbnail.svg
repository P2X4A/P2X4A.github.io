<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Esquema en 1FN: ESTUDIANTE e INSCRIPCION">
  <title>Esquema en 1FN: ESTUDIANTE e INSCRIPCION</title>
  <rect width="480" height="270" fill="#0d0d26" />
  <rect x="8" y="8" width="464" height="254" fill="none" stroke="#3d3d7a" stroke-width="4" />
  <rect x="16" y="16" width="448" height="238" fill="none" stroke="#1c1c4a" stroke-width="2" />

  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <!-- ESTUDIANTE -->
    <rect x="34" y="34" width="160" height="58" fill="#171740" stroke="#62b4f8" stroke-width="3" />
    <text x="44" y="52" fill="#62b4f8" font-size="11">ESTUDIANTE</text>
    <text x="44" y="68" fill="#b8b8d8" font-size="10" font-weight="normal">Cod PK</text>
    <text x="44" y="82" fill="#b8b8d8" font-size="10" font-weight="normal">Name, Email</text>

    <!-- INSCRIPCION -->
    <rect x="286" y="34" width="160" height="58" fill="#171740" stroke="#63de86" stroke-width="3" />
    <text x="296" y="52" fill="#63de86" font-size="11">INSCRIPCION</text>
    <text x="296" y="68" fill="#b8b8d8" font-size="10" font-weight="normal">(Cod, Course) PK</text>
    <text x="296" y="82" fill="#b8b8d8" font-size="10" font-weight="normal">GradePoints</text>

    <!-- relation -->
    <g stroke="#8a8ab8" stroke-width="2" fill="none">
      <path d="M194 63 H286" />
    </g>
    <g fill="#8a8ab8">
      <rect x="236" y="59" width="8" height="8" />
    </g>
    <text x="198" y="55" fill="#7df9ff" font-size="9" font-weight="normal">Cod FK</text>

    <!-- tabla original, con atributos multivaluados -->
    <rect x="34" y="138" width="412" height="60" fill="#171740" stroke="#f4677a" stroke-width="3" />
    <text x="44" y="158" fill="#f4677a" font-size="11">TABLA ORIGINAL — NO CUMPLE 1FN</text>
    <text x="44" y="174" fill="#b8b8d8" font-size="9" font-weight="normal">Courses, GradePoints</text>
    <text x="44" y="188" fill="#b8b8d8" font-size="9" font-weight="normal">"NN204, SI204, IT221"   "2, 3, 3"  →  varios valores en una celda</text>

    <text x="34" y="232" fill="#63de86" font-size="10">1FN — UNA FILA POR CURSO</text>
    <text x="34" y="246" fill="#b8b8d8" font-size="9" font-weight="normal">el curso y la nota, unidos de forma explicita</text>
  </g>
</svg>
