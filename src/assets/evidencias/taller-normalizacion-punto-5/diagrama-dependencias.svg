<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Diagrama de dependencias funcionales de la tabla Rentals en 1FN, con la llave compuesta (RentalID, Title), las dependencias parciales de cada mitad de la llave y la dependencia transitiva MovieCategory hacia Price">
  <title>Diagrama de dependencias funcionales — Rentals (1FN)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8ab8" />
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5b041" />
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#0d0d26" />
  <rect x="8" y="8" width="1184" height="544" fill="none" stroke="#3d3d7a" stroke-width="4" />
  <rect x="16" y="16" width="1168" height="528" fill="none" stroke="#1c1c4a" stroke-width="2" />

  <g font-family="'Courier New', Courier, monospace">
    <text x="60" y="58" fill="#e8e8ff" font-size="21" font-weight="bold">DEPENDENCIAS FUNCIONALES · Rentals (1FN)</text>

    <!-- llave compuesta -->
    <rect x="60" y="90" width="250" height="310" fill="none" stroke="#63de86" stroke-width="2" stroke-dasharray="9 7" />
    <text x="76" y="120" fill="#63de86" font-size="12" font-weight="bold">LLAVE PRIMARIA</text>
    <text x="76" y="138" fill="#63de86" font-size="11">(RentalID, Title)</text>

    <rect x="90" y="152" width="190" height="52" fill="#171740" stroke="#63de86" stroke-width="3" />
    <text x="104" y="184" fill="#63de86" font-size="16" font-weight="bold">RentalID</text>

    <rect x="90" y="300" width="190" height="52" fill="#171740" stroke="#63de86" stroke-width="3" />
    <text x="104" y="332" fill="#63de86" font-size="16" font-weight="bold">Title</text>

    <!-- atributos dependientes -->
    <rect x="400" y="110" width="230" height="52" fill="#14143a" stroke="#62b4f8" stroke-width="2" />
    <text x="414" y="142" fill="#cfe6ff" font-size="15">CustomerID</text>

    <rect x="400" y="190" width="230" height="52" fill="#14143a" stroke="#62b4f8" stroke-width="2" />
    <text x="414" y="222" fill="#cfe6ff" font-size="15">MailedOutDate</text>

    <rect x="430" y="280" width="210" height="52" fill="#14143a" stroke="#62b4f8" stroke-width="2" />
    <text x="444" y="312" fill="#cfe6ff" font-size="15">Director</text>

    <rect x="430" y="360" width="240" height="52" fill="#14143a" stroke="#62b4f8" stroke-width="2" />
    <text x="444" y="392" fill="#cfe6ff" font-size="15">MovieCategory</text>

    <rect x="760" y="360" width="180" height="52" fill="#14143a" stroke="#f5b041" stroke-width="2" />
    <text x="774" y="392" fill="#f5b041" font-size="15">Price</text>

    <!-- dependencias parciales -->
    <g stroke="#8a8ab8" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M280 176 H330 V136 H400" />
      <path d="M280 176 H330 V216 H400" />
      <path d="M280 326 H360 V306 H430" />
      <path d="M280 326 H360 V386 H430" />
    </g>

    <!-- dependencia transitiva -->
    <path d="M670 386 H760" stroke="#f5b041" stroke-width="2" fill="none" marker-end="url(#arrowT)" />

    <text x="368" y="320" fill="#8a8ab8" font-size="10">parcial</text>
    <text x="678" y="378" fill="#f5b041" font-size="10">transitiva</text>

    <!-- leyenda -->
    <g font-size="12">
      <path d="M60 448 H100" stroke="#8a8ab8" stroke-width="2" marker-end="url(#arrow)" />
      <text x="112" y="452" fill="#b8b8d8">Dependencia parcial: el atributo depende de una sola mitad de la llave.</text>
      <path d="M60 486 H100" stroke="#f5b041" stroke-width="2" marker-end="url(#arrowT)" />
      <text x="112" y="490" fill="#b8b8d8">Dependencia transitiva: Title → MovieCategory → Price.</text>
      <text x="60" y="524" fill="#f4677a">La muestra no contradice Director → Title, pero un director hace varias películas: la válida es Title → Director.</text>
    </g>
  </g>
</svg>
