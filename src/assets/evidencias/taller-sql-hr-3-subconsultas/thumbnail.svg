<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Portada del taller 3 de SQL sobre el esquema HR de Oracle: una consulta de ejemplo y las etiquetas EXISTS, ALL, IN, SUBQUERY">
  <title>Taller SQL HR 3 — Subconsultas y retos de RR. HH.</title>
  <rect width="480" height="270" fill="#0d0d26" />
  <rect x="8" y="8" width="464" height="254" fill="none" stroke="#3d3d7a" stroke-width="4" />
  <rect x="16" y="16" width="448" height="238" fill="none" stroke="#1c1c4a" stroke-width="2" />

  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <text x="32" y="44" fill="#63de86" font-size="14">TALLER SQL · HR</text>
    <text x="448" y="44" fill="#f4677a" font-size="14" text-anchor="end">#03</text>

    <rect x="32" y="56" width="416" height="132" fill="#171740" stroke="#62b4f8" stroke-width="3" />
    <rect x="32" y="56" width="416" height="18" fill="#62b4f8" />
    <text x="42" y="69" fill="#0d0d26" font-size="9">consulta.sql</text>
    <text x="44" y="94" font-size="10" xml:space="preserve"><tspan fill="#f4677a">SELECT</tspan><tspan fill="#e8e8ff"> first_name, salary</tspan></text>
    <text x="44" y="109" font-size="10" xml:space="preserve"><tspan fill="#f4677a">FROM</tspan><tspan fill="#e8e8ff">   hr.employees e</tspan></text>
    <text x="44" y="124" font-size="10" xml:space="preserve"><tspan fill="#f4677a">WHERE</tspan><tspan fill="#e8e8ff">  salary &gt; (</tspan><tspan fill="#f4677a">SELECT</tspan><tspan fill="#e8e8ff"> AVG(salary)</tspan></text>
    <text x="44" y="139" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">                 </tspan><tspan fill="#f4677a">FROM</tspan><tspan fill="#e8e8ff"> hr.employees</tspan></text>
    <text x="44" y="154" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">                 </tspan><tspan fill="#f4677a">WHERE</tspan><tspan fill="#e8e8ff"> department_id =</tspan></text>
    <text x="44" y="169" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">                       e.department_id);</tspan></text>

    <rect x="32" y="202" width="72" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="68" y="219" fill="#63de86" font-size="10" text-anchor="middle">EXISTS</text>
    <rect x="116" y="202" width="48" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="140" y="219" fill="#63de86" font-size="10" text-anchor="middle">ALL</text>
    <rect x="176" y="202" width="40" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="196" y="219" fill="#63de86" font-size="10" text-anchor="middle">IN</text>
    <rect x="228" y="202" width="88" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="272" y="219" fill="#63de86" font-size="10" text-anchor="middle">SUBQUERY</text>

    <text x="32" y="248" fill="#b8b8d8" font-size="8" font-weight="normal">SUBCONSULTAS Y RETOS DE RR. HH.</text>
  </g>
</svg>
