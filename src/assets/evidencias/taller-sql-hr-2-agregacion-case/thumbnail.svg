<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Portada del taller 2 de SQL sobre el esquema HR de Oracle: una consulta de ejemplo y las etiquetas GROUP BY, HAVING, CASE, LISTAGG">
  <title>Taller SQL HR 2 — Agregación, GROUP BY y CASE</title>
  <rect width="480" height="270" fill="#0d0d26" />
  <rect x="8" y="8" width="464" height="254" fill="none" stroke="#3d3d7a" stroke-width="4" />
  <rect x="16" y="16" width="448" height="238" fill="none" stroke="#1c1c4a" stroke-width="2" />

  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <text x="32" y="44" fill="#63de86" font-size="14">TALLER SQL · HR</text>
    <text x="448" y="44" fill="#f4677a" font-size="14" text-anchor="end">#02</text>

    <rect x="32" y="56" width="416" height="118" fill="#171740" stroke="#62b4f8" stroke-width="3" />
    <rect x="32" y="56" width="416" height="18" fill="#62b4f8" />
    <text x="42" y="69" fill="#0d0d26" font-size="9">consulta.sql</text>
    <text x="44" y="96" font-size="12" xml:space="preserve"><tspan fill="#f4677a">SELECT</tspan><tspan fill="#e8e8ff"> department_name, COUNT(*)</tspan></text>
    <text x="44" y="115" font-size="12" xml:space="preserve"><tspan fill="#f4677a">FROM</tspan><tspan fill="#e8e8ff">   hr.employees </tspan><tspan fill="#f4677a">JOIN</tspan><tspan fill="#e8e8ff"> hr.departments</tspan></text>
    <text x="44" y="134" font-size="12" xml:space="preserve"><tspan fill="#f4677a">GROUP</tspan><tspan fill="#e8e8ff">  </tspan><tspan fill="#f4677a">BY</tspan><tspan fill="#e8e8ff"> department_name</tspan></text>
    <text x="44" y="153" font-size="12" xml:space="preserve"><tspan fill="#f4677a">HAVING</tspan><tspan fill="#e8e8ff"> COUNT(*) &gt; 10;</tspan></text>

    <rect x="32" y="188" width="88" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="76" y="205" fill="#63de86" font-size="10" text-anchor="middle">GROUP BY</text>
    <rect x="132" y="188" width="72" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="168" y="205" fill="#63de86" font-size="10" text-anchor="middle">HAVING</text>
    <rect x="216" y="188" width="56" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="244" y="205" fill="#63de86" font-size="10" text-anchor="middle">CASE</text>
    <rect x="284" y="188" width="80" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="324" y="205" fill="#63de86" font-size="10" text-anchor="middle">LISTAGG</text>

    <text x="32" y="248" fill="#b8b8d8" font-size="8" font-weight="normal">AGREGACIÓN, GROUP BY Y CASE</text>
  </g>
</svg>
