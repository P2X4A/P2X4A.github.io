<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Portada del taller 5 de SQL sobre el esquema HR de Oracle: una consulta de ejemplo y las etiquetas LPAD, ADD_MONTHS, NVL2, DECODE">
  <title>Taller SQL HR 5 — Funciones de texto, número y fecha</title>
  <rect width="480" height="270" fill="#0d0d26" />
  <rect x="8" y="8" width="464" height="254" fill="none" stroke="#3d3d7a" stroke-width="4" />
  <rect x="16" y="16" width="448" height="238" fill="none" stroke="#1c1c4a" stroke-width="2" />

  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <text x="32" y="44" fill="#63de86" font-size="14">TALLER SQL · HR</text>
    <text x="448" y="44" fill="#f4677a" font-size="14" text-anchor="end">#05</text>

    <rect x="32" y="56" width="416" height="117" fill="#171740" stroke="#62b4f8" stroke-width="3" />
    <rect x="32" y="56" width="416" height="18" fill="#62b4f8" />
    <text x="42" y="69" fill="#0d0d26" font-size="9">consulta.sql</text>
    <text x="44" y="94" font-size="10" xml:space="preserve"><tspan fill="#f4677a">SELECT</tspan><tspan fill="#e8e8ff"> first_name,</tspan></text>
    <text x="44" y="109" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">       MONTHS_BETWEEN(DATE '2018-12-31',</tspan></text>
    <text x="44" y="124" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">                      hire_date) / 12</tspan></text>
    <text x="44" y="139" font-size="10" xml:space="preserve"><tspan fill="#f4677a">FROM</tspan><tspan fill="#e8e8ff">   hr.employees</tspan></text>
    <text x="44" y="154" font-size="10" xml:space="preserve"><tspan fill="#f4677a">WHERE</tspan><tspan fill="#e8e8ff">  MOD(employee_id, 5) = 0;</tspan></text>

    <rect x="32" y="187" width="56" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="60" y="204" fill="#63de86" font-size="10" text-anchor="middle">LPAD</text>
    <rect x="100" y="187" width="104" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="152" y="204" fill="#63de86" font-size="10" text-anchor="middle">ADD_MONTHS</text>
    <rect x="216" y="187" width="56" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="244" y="204" fill="#63de86" font-size="10" text-anchor="middle">NVL2</text>
    <rect x="284" y="187" width="72" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="320" y="204" fill="#63de86" font-size="10" text-anchor="middle">DECODE</text>

    <text x="32" y="248" fill="#b8b8d8" font-size="8" font-weight="normal">FUNCIONES DE TEXTO, NÚMERO Y FECHA</text>
  </g>
</svg>
