<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Portada del taller 4 de SQL sobre el esquema HR de Oracle: una consulta de ejemplo y las etiquetas LEFT JOIN, SELF JOIN, FULL JOIN, USING">
  <title>Taller SQL HR 4 — JOIN y combinación de tablas</title>
  <rect width="480" height="270" fill="#0d0d26" />
  <rect x="8" y="8" width="464" height="254" fill="none" stroke="#3d3d7a" stroke-width="4" />
  <rect x="16" y="16" width="448" height="238" fill="none" stroke="#1c1c4a" stroke-width="2" />

  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <text x="32" y="44" fill="#63de86" font-size="14">TALLER SQL · HR</text>
    <text x="448" y="44" fill="#f4677a" font-size="14" text-anchor="end">#04</text>

    <rect x="32" y="56" width="416" height="132" fill="#171740" stroke="#62b4f8" stroke-width="3" />
    <rect x="32" y="56" width="416" height="18" fill="#62b4f8" />
    <text x="42" y="69" fill="#0d0d26" font-size="9">consulta.sql</text>
    <text x="44" y="94" font-size="10" xml:space="preserve"><tspan fill="#f4677a">SELECT</tspan><tspan fill="#e8e8ff"> d.department_name,</tspan></text>
    <text x="44" y="109" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">       COUNT(e.employee_id)</tspan></text>
    <text x="44" y="124" font-size="10" xml:space="preserve"><tspan fill="#f4677a">FROM</tspan><tspan fill="#e8e8ff">   hr.departments d</tspan></text>
    <text x="44" y="139" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">LEFT   </tspan><tspan fill="#f4677a">JOIN</tspan><tspan fill="#e8e8ff"> hr.employees e</tspan></text>
    <text x="44" y="154" font-size="10" xml:space="preserve"><tspan fill="#e8e8ff">       ON e.department_id = d.department_id</tspan></text>
    <text x="44" y="169" font-size="10" xml:space="preserve"><tspan fill="#f4677a">GROUP</tspan><tspan fill="#e8e8ff">  </tspan><tspan fill="#f4677a">BY</tspan><tspan fill="#e8e8ff"> d.department_name;</tspan></text>

    <rect x="32" y="202" width="96" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="80" y="219" fill="#63de86" font-size="10" text-anchor="middle">LEFT JOIN</text>
    <rect x="140" y="202" width="96" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="188" y="219" fill="#63de86" font-size="10" text-anchor="middle">SELF JOIN</text>
    <rect x="248" y="202" width="96" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="296" y="219" fill="#63de86" font-size="10" text-anchor="middle">FULL JOIN</text>
    <rect x="356" y="202" width="64" height="26" fill="#171740" stroke="#63de86" stroke-width="2" /><text x="388" y="219" fill="#63de86" font-size="10" text-anchor="middle">USING</text>

    <text x="32" y="248" fill="#b8b8d8" font-size="8" font-weight="normal">JOIN Y COMBINACIÓN DE TABLAS</text>
  </g>
</svg>
